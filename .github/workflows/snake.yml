name: generate profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#24292f&color_dots=#ebedf0,#c6dbff,#79b8ff,#388bfd,#0550ae
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f0f6fc&color_dots=#161b22,#0c2d6b,#1158c7,#388bfd,#79c0ff

      # METRICS_TOKEN（repo 権限の PAT）があれば private リポジトリも集計する
      - name: generate language chart
        run: python3 scripts/langs.py dist/langs.svg
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          INCLUDE_PRIVATE: ${{ secrets.METRICS_TOKEN != '' && '1' || '' }}

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
